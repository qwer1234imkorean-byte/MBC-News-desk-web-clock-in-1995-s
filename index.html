<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBC 시보 시계 (MBC Classic Clock)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000038; /* Classic MBC Deep Royal Blue */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: sans-serif;
        }

        #clockCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 오디오 활성화 안내 팁 */
        #audioNotice {
            position: absolute;
            bottom: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.5s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="clockCanvas"></canvas>
    <div id="audioNotice">🔔 화면 아무 곳이나 클릭(터치)하면 시보음이 활성화됩니다.</div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const audioNotice = document.getElementById('audioNotice');

        // Audio Context setup
        let audioCtx = null;
        let isAudioUnlocked = false;
        let lastChimeHour = -1;

        // High DPI canvas handling
        let dpr = window.devicePixelRatio || 1;
        let width = 0;
        let height = 0;
        let centerX = 0;
        let centerY = 0;
        let clockRadius = 0;

        function getAccurateTime() {
            return new Date();
        }

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioUnlocked = true;

            // 소리 활성화 안내 문구 숨기기
            if (audioNotice) {
                audioNotice.style.opacity = '0';
                setTimeout(() => { audioNotice.style.display = 'none'; }, 500);
            }
        }

        // 화면 클릭/터치/키 입력 시 오디오 자동 해제
        ['click', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, () => {
                initAudioContext();
            }, { once: false });
        });

        // 음계 주파수 정의
        const NOTES = {
            C4: 261.63, E4: 329.63, G4: 392.00, A4: 440.00,
            B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25,
            A5: 880.00
        };

        // Web Audio API로 MBC 시보 멜로디 + 삐- 시보음 재생 (정각 10초 전 실행)
        function playMbcFullChimeSequence() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const startTime = audioCtx.currentTime;

            function playNote(freq, startOffset, duration, type = 'sine', volume = 0.3) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, startTime + startOffset);

                gain.gain.setValueAtTime(0, startTime + startOffset);
                gain.gain.linearRampToValueAtTime(volume, startTime + startOffset + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + startOffset + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(startTime + startOffset);
                osc.stop(startTime + startOffset + duration + 0.05);
            }

            // MBC 10초 전 시보 멜로디
            const melody = [
                { note: NOTES.C4, start: 0.0, dur: 0.6 },
                { note: NOTES.E4, start: 0.8, dur: 0.6 },
                { note: NOTES.G4, start: 1.6, dur: 0.6 },
                { note: NOTES.C5, start: 2.4, dur: 1.2 },
                { note: NOTES.G4, start: 4.0, dur: 0.6 },
                { note: NOTES.E5, start: 4.8, dur: 1.2 }
            ];

            melody.forEach(item => {
                playNote(item.note, item.start, item.dur, 'triangle', 0.4);
            });

            // 57초, 58초, 59초 예비음 (440Hz 예비 삐-음)
            playNote(NOTES.A4, 7.0, 0.3, 'sine', 0.5); // 57초
            playNote(NOTES.A4, 8.0, 0.3, 'sine', 0.5); // 58초
            playNote(NOTES.A4, 9.0, 0.3, 'sine', 0.5); // 59초

            // 00초 정각 정시음 (880Hz 높은 삐----음)
            playNote(NOTES.A5, 10.0, 2.0, 'sine', 0.7); // 00초 정각
        }

        function checkAndPlayChime(nowDate) {
            const currentHour = nowDate.getHours();
            const currentMinute = nowDate.getMinutes();
            const currentSecond = nowDate.getSeconds();

            // 정각 10초 전 (59분 50초)에 시보 멜로디 + 시보음 실행
            if (currentMinute === 59 && currentSecond === 50) {
                if (lastChimeHour !== currentHour) {
                    lastChimeHour = currentHour;
                    playMbcFullChimeSequence();
                }
            }

            // 정각 이후 트리거 잠금 해제
            if (currentMinute === 0 && currentSecond > 5) {
                if (lastChimeHour === currentHour) {
                    lastChimeHour = -1;
                }
            }
        }

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);

            centerX = width / 2;
            centerY = height / 2;
            clockRadius = Math.min(width, height) * 0.41;
        }

        window.addEventListener('resize', resize);
        resize();

        function renderClock() {
            const now = getAccurateTime();
            checkAndPlayChime(now);

            // Clear screen
            ctx.clearRect(0, 0, width, height);

            // 1. Classic MBC Dark Blue Background
            ctx.fillStyle = '#000038';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Hour Markers (Ticks) with 3D drop shadows
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const isMain = (i % 3 === 0);

                const markerLength = clockRadius * (isMain ? 0.17 : 0.125);
                const markerWidth = clockRadius * (isMain ? 0.055 : 0.038);
                const outerDist = clockRadius * 0.95;
                const innerDist = outerDist - markerLength;

                const shadowX = clockRadius * 0.018;
                const shadowY = clockRadius * 0.018;

                ctx.save();
                ctx.translate(centerX, centerY);

                // Black Drop Shadow Ticks
                ctx.beginPath();
                ctx.moveTo(Math.sin(angle) * innerDist + shadowX, -Math.cos(angle) * innerDist + shadowY);
                ctx.lineTo(Math.sin(angle) * outerDist + shadowX, -Math.cos(angle) * outerDist + shadowY);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = markerWidth;
                ctx.lineCap = 'butt';
                ctx.stroke();

                // White Front Ticks
                ctx.beginPath();
                ctx.moveTo(Math.sin(angle) * innerDist, -Math.cos(angle) * innerDist);
                ctx.lineTo(Math.sin(angle) * outerDist, -Math.cos(angle) * outerDist);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = markerWidth;
                ctx.lineCap = 'butt';
                ctx.stroke();

                ctx.restore();
            }

            // 3. MBC Retro Logo (positioned below clock center)
            ctx.save();
            ctx.translate(centerX, centerY + clockRadius * 0.52);
            const logoFontSize = clockRadius * 0.18;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `900 ${logoFontSize}px 'Orbitron', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('MBC', 0, 0);
            ctx.restore();

            // 4. Time calculations
            const ms = now.getMilliseconds();
            const sec = now.getSeconds() + ms / 1000;
            const min = now.getMinutes() + sec / 60;
            const hr = (now.getHours() % 12) + min / 60;

            const hourAngle = hr * 30 * (Math.PI / 180);
            const minAngle = min * 6 * (Math.PI / 180);
            const secAngle = sec * 6 * (Math.PI / 180);

            // 5. Hour Hand
            const hourHandLength = clockRadius * 0.48;
            const hourHandWidth = clockRadius * 0.052;
            const shadowOffset = clockRadius * 0.02;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(hourAngle);

            // Hour Hand Shadow
            ctx.beginPath();
            ctx.moveTo(shadowOffset, clockRadius * 0.04 + shadowOffset);
            ctx.lineTo(shadowOffset, -hourHandLength + shadowOffset);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = hourHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Hour Hand White Body
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -hourHandLength);
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = hourHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Center inner black stripe on hour hand
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -hourHandLength);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = hourHandWidth * 0.2;
            ctx.stroke();

            ctx.restore();

            // 6. Minute Hand
            const minHandLength = clockRadius * 0.72;
            const minHandWidth = clockRadius * 0.036;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(minAngle);

            // Minute Hand Shadow
            ctx.beginPath();
            ctx.moveTo(shadowOffset, clockRadius * 0.04 + shadowOffset);
            ctx.lineTo(shadowOffset, -minHandLength + shadowOffset);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = minHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Minute Hand Body
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -minHandLength);
            ctx.strokeStyle = '#2233FF';
            ctx.lineWidth = minHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            ctx.restore();

            // 7. Dual Classic MBC Second Hands
            const secHandLength = clockRadius * 0.84;
            const secHandWidth = clockRadius * 0.02;

            // Secondary / Black Offset Second Hand
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(secAngle - 0.05);

            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.05);
            ctx.lineTo(0, -secHandLength * 0.95);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = secHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();
            ctx.restore();

            // Primary Red Second Hand
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(secAngle);

            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.05);
            ctx.lineTo(0, -secHandLength);
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = secHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();
            ctx.restore();

            // 8. Center Yellow Pivot Cap
            ctx.save();
            ctx.translate(centerX, centerY);

            // Cap Shadow
            ctx.beginPath();
            ctx.arc(clockRadius * 0.012, clockRadius * 0.012, clockRadius * 0.05, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Yellow Center Dot
            ctx.beginPath();
            ctx.arc(0, 0, clockRadius * 0.05, 0, Math.PI * 2);
            ctx.fillStyle = '#FFE500';
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(renderClock);
        }

        window.onload = function() {
            requestAnimationFrame(renderClock);
        };
    </script>
</body>
</html>
