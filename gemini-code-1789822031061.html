<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBC 시보 시계 (MBC Classic Clock)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000038; /* Classic MBC Deep Royal Blue */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #clockCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="clockCanvas"></canvas>
    
    <!-- MBC 시보음 MP3 음원 (정각 10초 전 출력) -->
    <audio id="chimeAudio" preload="auto" src="audio_file_0.mp3"></audio>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('chimeAudio');

        // Audio Context setup for high precision chime synthesis + fallback
        let audioCtx = null;
        let isAudioUnlocked = false;
        let lastChimeHour = -1;
        let ntpOffsetMs = 0; // Offset between client system clock and standard time

        // High DPI canvas handling
        let dpr = window.devicePixelRatio || 1;
        let width = 0;
        let height = 0;
        let centerX = 0;
        let centerY = 0;
        let clockRadius = 0;

        // Simulated high-precision NTP sync check with fallback
        async function syncNTPTime() {
            try {
                const startTime = performance.now();
                const response = await fetch('https://worldtimeapi.org/api/ip', { cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();
                    const serverTime = new Date(data.utc_datetime).getTime();
                    const latency = (performance.now() - startTime) / 2;
                    const realNow = serverTime + latency;
                    ntpOffsetMs = realNow - Date.now();
                    console.log(`NTP synced (Offset: ${ntpOffsetMs.toFixed(2)}ms)`);
                }
            } catch (err) {
                ntpOffsetMs = 0;
            }
        }
        syncNTPTime();
        setInterval(syncNTPTime, 300000); // Re-sync every 5 minutes

        function getAccurateTime() {
            return new Date(Date.now() + ntpOffsetMs);
        }

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Unlock audio element
            if (audioElement) {
                audioElement.play().then(() => {
                    audioElement.pause();
                    audioElement.currentTime = 0;
                    isAudioUnlocked = true;
                }).catch(() => {
                    isAudioUnlocked = true; // Still allow Web Audio API fallback
                });
            } else {
                isAudioUnlocked = true;
            }
        }

        // Invisible silent user interaction unlock listener
        ['click', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, () => {
                initAudioContext();
            }, { once: false });
        });

        // Web Audio API Synthesizer (MP3 파일 재생 실패 시 대체용)
        function playSynthesizedChimeSequence() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            
            // 3 preparation beeps (57s, 58s, 59s -> 440Hz / A4)
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now + i);
                
                gain.gain.setValueAtTime(0, now + i);
                gain.gain.linearRampToValueAtTime(0.6, now + i + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + i + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + i);
                osc.stop(now + i + 0.3);
            }

            // High Pitch Final Top-of-the-hour chime (00s -> 880Hz / A5)
            const mainOsc = audioCtx.createOscillator();
            const mainGain = audioCtx.createGain();

            mainOsc.type = 'sine';
            mainOsc.frequency.setValueAtTime(880, now + 3);

            mainGain.gain.setValueAtTime(0, now + 3);
            mainGain.gain.linearRampToValueAtTime(0.8, now + 3 + 0.02);
            mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 3 + 1.8);

            mainOsc.connect(mainGain);
            mainGain.connect(audioCtx.destination);

            mainOsc.start(now + 3);
            mainOsc.stop(now + 3 + 2.0);
        }

        function checkAndPlayChime(nowDate) {
            const currentHour = nowDate.getHours();
            const currentMinute = nowDate.getMinutes();
            const currentSecond = nowDate.getSeconds();

            // 정각 10초 전 (59분 50초)에 MP3 시보음 재생 트리거
            if (currentMinute === 59 && currentSecond === 50) {
                if (lastChimeHour !== currentHour) {
                    lastChimeHour = currentHour;
                    
                    if (audioElement && audioElement.src) {
                        audioElement.currentTime = 0;
                        audioElement.play().catch(() => {
                            // MP3 재생 제한 시 Web Audio API 예비 시보음 실행
                            playSynthesizedChimeSequence();
                        });
                    } else {
                        playSynthesizedChimeSequence();
                    }
                }
            }

            // 정각 이후 트리거 잠금 해제
            if (currentMinute === 0 && currentSecond > 5) {
                if (lastChimeHour === currentHour) {
                    lastChimeHour = -1;
                }
            }
        }

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);

            centerX = width / 2;
            centerY = height / 2;
            clockRadius = Math.min(width, height) * 0.41;
        }

        window.addEventListener('resize', resize);
        resize();

        function renderClock() {
            const now = getAccurateTime();
            checkAndPlayChime(now);

            // Clear screen
            ctx.clearRect(0, 0, width, height);

            // 1. Classic MBC Dark Blue Background
            ctx.fillStyle = '#000038';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Hour Markers (Ticks) with 3D drop shadows
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const isMain = (i % 3 === 0);

                const markerLength = clockRadius * (isMain ? 0.17 : 0.125);
                const markerWidth = clockRadius * (isMain ? 0.055 : 0.038);
                const outerDist = clockRadius * 0.95;
                const innerDist = outerDist - markerLength;

                const shadowX = clockRadius * 0.018;
                const shadowY = clockRadius * 0.018;

                ctx.save();
                ctx.translate(centerX, centerY);

                // Black Drop Shadow Ticks
                ctx.beginPath();
                ctx.moveTo(Math.sin(angle) * innerDist + shadowX, -Math.cos(angle) * innerDist + shadowY);
                ctx.lineTo(Math.sin(angle) * outerDist + shadowX, -Math.cos(angle) * outerDist + shadowY);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = markerWidth;
                ctx.lineCap = 'butt';
                ctx.stroke();

                // White Front Ticks
                ctx.beginPath();
                ctx.moveTo(Math.sin(angle) * innerDist, -Math.cos(angle) * innerDist);
                ctx.lineTo(Math.sin(angle) * outerDist, -Math.cos(angle) * outerDist);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = markerWidth;
                ctx.lineCap = 'butt';
                ctx.stroke();

                ctx.restore();
            }

            // 3. MBC Retro Logo (positioned below clock center)
            ctx.save();
            ctx.translate(centerX, centerY + clockRadius * 0.52);
            const logoFontSize = clockRadius * 0.18;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `900 ${logoFontSize}px 'Orbitron', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('MBC', 0, 0);
            ctx.restore();

            // 4. Time calculations
            const ms = now.getMilliseconds();
            const sec = now.getSeconds() + ms / 1000;
            const min = now.getMinutes() + sec / 60;
            const hr = (now.getHours() % 12) + min / 60;

            const hourAngle = hr * 30 * (Math.PI / 180);
            const minAngle = min * 6 * (Math.PI / 180);
            const secAngle = sec * 6 * (Math.PI / 180);

            // 5. Hour Hand (White with inner line and shadow)
            const hourHandLength = clockRadius * 0.48;
            const hourHandWidth = clockRadius * 0.052;
            const shadowOffset = clockRadius * 0.02;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(hourAngle);

            // Hour Hand Shadow
            ctx.beginPath();
            ctx.moveTo(shadowOffset, clockRadius * 0.04 + shadowOffset);
            ctx.lineTo(shadowOffset, -hourHandLength + shadowOffset);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = hourHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Hour Hand White Body
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -hourHandLength);
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = hourHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Center inner black stripe on hour hand
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -hourHandLength);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = hourHandWidth * 0.2;
            ctx.stroke();

            ctx.restore();

            // 6. Minute Hand (Classic Blue / White with offset)
            const minHandLength = clockRadius * 0.72;
            const minHandWidth = clockRadius * 0.036;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(minAngle);

            // Minute Hand Shadow
            ctx.beginPath();
            ctx.moveTo(shadowOffset, clockRadius * 0.04 + shadowOffset);
            ctx.lineTo(shadowOffset, -minHandLength + shadowOffset);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = minHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            // Minute Hand Body
            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.04);
            ctx.lineTo(0, -minHandLength);
            ctx.strokeStyle = '#2233FF'; // Classic Blue Minute Hand Accent
            ctx.lineWidth = minHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();

            ctx.restore();

            // 7. Dual Classic MBC Second Hands (Red hand & Black/Blue trail hand)
            const secHandLength = clockRadius * 0.84;
            const secHandWidth = clockRadius * 0.02;

            // Secondary / Black Offset Second Hand
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(secAngle - 0.05);

            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.05);
            ctx.lineTo(0, -secHandLength * 0.95);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = secHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();
            ctx.restore();

            // Primary Red Second Hand
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(secAngle);

            ctx.beginPath();
            ctx.moveTo(0, clockRadius * 0.05);
            ctx.lineTo(0, -secHandLength);
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = secHandWidth;
            ctx.lineCap = 'square';
            ctx.stroke();
            ctx.restore();

            // 8. Center Yellow Pivot Cap
            ctx.save();
            ctx.translate(centerX, centerY);

            // Cap Shadow
            ctx.beginPath();
            ctx.arc(clockRadius * 0.012, clockRadius * 0.012, clockRadius * 0.05, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Yellow Center Dot
            ctx.beginPath();
            ctx.arc(0, 0, clockRadius * 0.05, 0, Math.PI * 2);
            ctx.fillStyle = '#FFE500';
            ctx.fill();

            ctx.restore();

            // Request next frame
            requestAnimationFrame(renderClock);
        }

        window.onload = function() {
            initAudioContext();
            requestAnimationFrame(renderClock);
        };
    </script>
</body>
</html>
